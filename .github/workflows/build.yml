name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Native 64-bit ARM runner, so the musl build is not a cross build.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-musl
          rustflags: ""

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test

      - name: Build static binary
        run: |
          cargo build --release --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/rover-tui rover-tui-aarch64-linux
          sha256sum rover-tui-aarch64-linux > rover-tui-aarch64-linux.sha256
          file rover-tui-aarch64-linux
          ls -la rover-tui-aarch64-linux
          ./rover-tui-aarch64-linux --help

      - uses: actions/upload-artifact@v4
        with:
          name: rover-tui-aarch64-linux
          path: |
            rover-tui-aarch64-linux
            rover-tui-aarch64-linux.sha256
            Cargo.lock

      # Rolling "latest" release that rover-tui.sh downloads from.
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 ||
            gh release create latest --title "latest build" --notes "Rolling build of main." --target "$GITHUB_SHA"
          gh release upload latest rover-tui-aarch64-linux rover-tui-aarch64-linux.sha256 rover-tui.sh --clobber
          gh release edit latest --notes "Rolling build of main, last built from ${GITHUB_SHA::7}."
